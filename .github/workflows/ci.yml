name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Primary job: lint + format check + typecheck + tests + build, on the
  # development interpreter pinned in .tool-versions. This job's name is
  # the required status check in the repo ruleset — renaming it silently
  # un-protects `main`.
  # ────────────────────────────────────────────────────────────────────────
  python:
    name: python (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .tool-versions is the single source of truth for the dev
      # interpreter: asdf reads it locally, this step reads it for CI. uv
      # only understands `.python-version`, so rather than keep a second
      # pin file that can drift, we extract the version here and hand it
      # to setup-uv.
      - name: Read Python version from .tool-versions
        id: python-version
        run: echo "version=$(awk '/^python /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      # Pinned to an exact version on purpose: setup-uv publishes no
      # floating major tag (there is no `v9`), so `@v9` fails to resolve.
      # Dependabot bumps this line.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          activate-environment: true
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

  # ────────────────────────────────────────────────────────────────────────
  # Support-matrix job: the package advertises Python 3.11+ in
  # requires-python and its classifiers, so prove it. Tests only — lint,
  # format, and typecheck are interpreter-independent and already covered
  # above. Keep this list in sync with requires-python + classifiers.
  # ────────────────────────────────────────────────────────────────────────
  pytest-matrix:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to an exact version on purpose: setup-uv publishes no
      # floating major tag (there is no `v9`), so `@v9` fails to resolve.
      # Dependabot bumps this line.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Test
        run: pytest
